<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creator Essentials | Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf8f3; --ink:#16221c; --green:#22503f; --green-dark:#173a2d; --gold:#c59a3d;
  --muted:#6b7a72; --line:#e6e0d1;
  --serif:'DM Serif Display',Georgia,serif; --sans:'Jost','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

header{position:relative;border-bottom:1px solid var(--line);padding:28px 24px 26px;text-align:center}
header:after{content:"";position:absolute;left:50%;bottom:-1px;width:64px;height:2px;background:var(--gold);transform:translateX(-50%)}
.logo{display:inline-block;font-family:var(--serif);font-size:40px;line-height:1;color:var(--green);letter-spacing:.01em}

main{flex:1;display:grid;place-items:center;padding:56px 24px 110px}
.collabs{text-align:center;width:100%}
.cap{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:24px}
ul{list-style:none;display:grid;gap:14px}
li{display:flex;justify-content:center}
.collab{display:inline-flex;align-items:center;justify-content:center;gap:16px;width:min(340px,100%);padding:21px 36px;border:1.5px solid var(--green);color:var(--green);background:transparent;font-size:15px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;transition:background .2s,color .2s}
.collab span{transition:transform .2s;letter-spacing:0}
.collab:hover,.collab:focus-visible{background:var(--green);color:#fff}
.collab:hover span{transform:translateX(5px)}

.preview-tag{position:fixed;bottom:14px;right:14px;background:rgba(22,34,28,.88);color:#fff;font-size:11px;letter-spacing:.12em;padding:7px 12px;text-transform:uppercase}

@media(max-width:600px){
  header{padding:22px 16px 20px}
  .logo{font-size:32px}
  .collab{padding:19px 24px;font-size:14px}
}
@media(prefers-reduced-motion:reduce){
  .collab,.collab span{transition:none}
}
</style>
</head>
<body>

<header>
  <a href="./" class="logo" aria-label="Creator Essentials home">Creator Essentials</a>
</header>

<main>
  <div class="collabs">
    <div class="cap">Collaborators</div>
    <ul>
      <li><a class="collab" href="savage.html">Bear Grylls <span aria-hidden="true">→</span></a></li>
      <!-- To add the next collaborator, copy the line above and change the name and the file it links to, e.g.
      <li><a class="collab" href="jessica.html">Jessica Simpson <span aria-hidden="true">→</span></a></li> -->
    </ul>
  </div>
</main>

<div class="preview-tag">Preview mockup</div>

</body>
</html>
